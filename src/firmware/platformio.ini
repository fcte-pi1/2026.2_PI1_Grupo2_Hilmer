; Plataforma pioarduino: Arduino core 3.x sobre ESP-IDF 5.x

[platformio]
default_envs = esp32dev

; Permite incluir pelo caminho a partir de src/, ex.: "motores/motores.h"
[env]
build_flags = -Isrc

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Os testes rodam só no PC (ambiente native), não na placa
test_ignore = *
; Os exemplos de teste dos drivers têm o próprio setup() e ficam fora do firmware
build_src_filter = +<*> -<exemplos/>
; VL53L0X: sensores de distância. WebSockets: cliente usado em comunicacao/
lib_deps =
    pololu/VL53L0X@1.3.1
    links2004/WebSockets@2.6.1

; Exemplos mínimos dos drivers, para testar na placa
; Cada um troca o main.cpp por um arquivo de src/exemplos/
; Gravar com: pio run -e exemplo_<nome> -t upload
[exemplo]
build_src_filter = +<*> -<main.cpp> -<tarefas/> -<exemplos/>

[env:exemplo_motores]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/motores.cpp>

[env:exemplo_encoders]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/encoders.cpp>

[env:exemplo_energia]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/energia.cpp>

[env:exemplo_imu]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/imu.cpp>

[env:exemplo_distancia]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/distancia.cpp>

[env:exemplo_distancia_unico]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/distancia_unico.cpp>

[env:exemplo_wifi]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/wifi.cpp>

[env:exemplo_armazenamento]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/armazenamento.cpp>

; Motores com encoders, INA219 e sensores de distância
[env:exemplo_motores_sensores]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/motores_sensores.cpp>

; Dado bruto ao lado do processado: limiar de parede, média móvel e filtro dos encoders
[env:exemplo_processamento]
extends = env:esp32dev
build_src_filter = ${exemplo.build_src_filter} +<exemplos/processamento.cpp>

; Testes da lógica pura, rodando no PC (sem placa)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = ${env.build_flags} -std=gnu++17
build_src_filter =
    -<*>
    +<navegacao/>
