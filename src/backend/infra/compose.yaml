services:
  database:
    container_name: "microMouse-db-dev"
    image: "postgres:16.0-alpine3.18"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa o $ para a variável ser lida dentro do container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: "microMouse-backend"
    build:
      context: ..
    environment:
      # Mesmas credenciais do .env.development, mas o host é o serviço
      # "database" da rede do compose
      DATABASE_URL: "postgresql://localUser:localPassword@database:5432/microMouse?schema=public"
      PORT: 3002
      TELEMETRY_WS_PORT: 3001
    ports:
      - "3002:3002"
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "infra/scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    container_name: "microMouse-frontend"
    build:
      context: ../../frontend
    environment:
      # No servidor Next (SSR do /historico), fala com o container do backend pela rede interna
      API_URL: "http://backend:3002"
      NEXT_PUBLIC_API_URL: "http://localhost:3002"
      NEXT_PUBLIC_USE_MOCK: "false"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
